<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Вартовий</title>
<link rel="icon" type="image/png" href="icon-64.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6f7;
    --surface: #ffffff;
    --surface-2: #e9eef0;
    --border: #d7dfe2;
    --text: #16232a;
    --text-dim: #5c6f78;
    --accent: #0e7c8c;
    --accent-soft: rgba(14, 124, 140, 0.12);
    --accent-2: #7a5cc8;
    --c5: #d9822b;
    --c6: #c2508f;
    --ok: #1f8a4c;
    --ok-soft: rgba(31, 138, 76, 0.12);
    --warn: #96650a;
    --warn-soft: rgba(176, 125, 16, 0.14);
    --critical: #c23b3b;
    --critical-soft: rgba(194, 59, 59, 0.12);
    --info-soft: rgba(14, 124, 140, 0.1);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1416;
      --surface: #111c1f;
      --surface-2: #162326;
      --border: #223236;
      --text: #e6eef0;
      --text-dim: #8fa3aa;
      --accent: #3ecbde;
      --accent-soft: rgba(62, 203, 222, 0.14);
      --accent-2: #a58cf0;
      --c5: #f29e4c;
      --c6: #e879b0;
      --ok: #35d488;
      --ok-soft: rgba(53, 212, 136, 0.14);
      --warn: #f0b429;
      --warn-soft: rgba(240, 180, 41, 0.16);
      --critical: #ff6b6b;
      --critical-soft: rgba(255, 107, 107, 0.14);
      --info-soft: rgba(62, 203, 222, 0.1);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #0b1416;
    --surface: #111c1f;
    --surface-2: #162326;
    --border: #223236;
    --text: #e6eef0;
    --text-dim: #8fa3aa;
    --accent: #3ecbde;
    --accent-soft: rgba(62, 203, 222, 0.14);
    --accent-2: #a58cf0;
    --c5: #f29e4c;
    --c6: #e879b0;
    --ok: #35d488;
    --ok-soft: rgba(53, 212, 136, 0.14);
    --warn: #f0b429;
    --warn-soft: rgba(240, 180, 41, 0.16);
    --critical: #ff6b6b;
    --critical-soft: rgba(255, 107, 107, 0.14);
    --info-soft: rgba(62, 203, 222, 0.1);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }

  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 20;
    pointer-events: none;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
    max-width: 1180px;
    margin-inline: auto;
  }

  #gearBtn {
    position: fixed;
    left: max(14px, env(safe-area-inset-left, 0px));
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    z-index: 30;
    width: 46px;
    height: 46px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-dim);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
  }
  #gearBtn svg { width: 22px; height: 22px; }
  @media (max-width: 700px) {
    #gearBtn {
      position: absolute;
      top: calc(14px + env(safe-area-inset-top, 0px));
      right: max(14px, env(safe-area-inset-right, 0px));
      bottom: auto;
      left: auto;
      width: 40px;
      height: 40px;
      box-shadow: none;
    }
    header.top .top-right { margin-right: 50px; }
  }
  #gearBtn:hover, #gearBtn[aria-expanded='true'] { color: var(--accent); border-color: var(--accent); }

  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .dim { color: var(--text-dim); }

  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 26px;
    font-weight: 600;
    margin: 4px 0 2px;
    text-wrap: balance;
  }

  h2 { font-size: 13px; font-weight: 600; margin: 0 0 12px; }

  .subtitle { color: var(--text-dim); font-size: 12px; }

  .top-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 11px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: var(--surface-2);
    white-space: nowrap;
  }
  .pill.ok { color: var(--ok); background: var(--ok-soft); border-color: transparent; }
  .pill.warn { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .pill.critical { color: var(--critical); background: var(--critical-soft); border-color: transparent; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }

  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: 0.9; color: #fff; }
  .user-list summary { cursor: pointer; display: flex; align-items: baseline; gap: 10px; list-style: none; }
  .user-list summary::-webkit-details-marker { display: none; }
  .user-list summary h2 { margin: 0; }
  .user-list summary::before { content: '\25B8'; color: var(--text-dim); }
  .user-list[open] summary::before { content: '\25BE'; }
  .ul-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #settingsPanel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 14px;
    display: grid;
    gap: 10px;
  }
  .field-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .field { flex: 1 1 240px; display: grid; gap: 4px; min-width: 0; }
  .field label { font-size: 12px; color: var(--text-dim); }
  .field input {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 16px;
    padding: 8px 10px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    width: 100%;
  }
  .field-actions { display: flex; gap: 8px; }
  .settings-note { font-size: 12px; color: var(--text-dim); margin: 0; }

  nav.tabs {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 5;
    display: flex;
    gap: 4px;
    overflow-x: auto;
    padding: 6px;
    margin-bottom: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    scrollbar-width: none;
  }
  nav.tabs::-webkit-scrollbar { display: none; }
  nav.tabs button {
    flex: 1 0 auto;
    border: none;
    background: transparent;
    padding: 9px 16px;
    color: var(--text-dim);
    white-space: nowrap;
  }
  nav.tabs button:hover { color: var(--text); }
  nav.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  nav.tabs .badge {
    display: inline-block;
    min-width: 18px;
    padding: 1px 6px;
    margin-left: 6px;
    border-radius: 999px;
    font-size: 11px;
    background: var(--critical-soft);
    color: var(--critical);
  }
  nav.tabs .badge.warn { background: var(--warn-soft); color: var(--warn); }

  .notice { padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 12px; }
  .notice.critical { background: var(--critical-soft); color: var(--critical); }
  .notice.warn { background: var(--warn-soft); color: var(--warn); }
  .notice.info { background: var(--info-soft); color: var(--text-dim); }
  .notice.ok { background: var(--ok-soft); color: var(--ok); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-bottom: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    min-width: 0;
  }

  .kpi .label { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .kpi .value {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 28px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .kpi .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .progress-track { height: 6px; border-radius: 999px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .progress-fill.warn { background: var(--warn); }
  .progress-fill.critical { background: var(--critical); }

  .columns { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; margin-bottom: 12px; align-items: start; }
  .stack { display: grid; gap: 12px; margin-bottom: 12px; }

  .status-chip { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .status-chip.ok { background: var(--ok-soft); color: var(--ok); }
  .status-chip.warn { background: var(--warn-soft); color: var(--warn); }
  .status-chip.critical { background: var(--critical-soft); color: var(--critical); }
  .status-chip.info { background: var(--surface-2); color: var(--text-dim); }

  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
  .card-head h2 { margin: 0; }

  .line {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    font-size: 13px;
    padding: 7px 0;
    border-top: 1px solid var(--border);
  }
  .line:first-of-type { border-top: none; }
  .line .k { color: var(--text-dim); }
  .line .v { font-family: 'IBM Plex Mono', monospace; text-align: right; overflow-wrap: anywhere; }

  .bar-row { display: grid; grid-template-columns: minmax(70px, 130px) 1fr auto; gap: 10px; align-items: center; padding: 5px 0; font-size: 13px; }
  .bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-row.wide { grid-template-columns: minmax(150px, 45%) 1fr auto; }
  .bar-row.wide .name { font-family: 'IBM Plex Mono', monospace; font-size: 12px; white-space: normal; overflow-wrap: anywhere; }
  .bar-row .track { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
  .bar-row .fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .bar-row .num { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-dim); }

  .chart { width: 100%; height: auto; display: block; }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart .axis { fill: var(--text-dim); font-size: 10px; font-family: 'IBM Plex Mono', monospace; }
  .chart .bar-a { fill: var(--accent); }
  .chart .bar-b { fill: var(--accent-2); }
  .chart .bar-c { fill: var(--ok); }
  .chart .seg-0 { fill: var(--accent); }
  .chart .seg-1 { fill: var(--accent-2); }
  .chart .seg-2 { fill: var(--ok); }
  .chart .seg-3 { fill: var(--c5); }
  .chart .seg-4 { fill: var(--c6); }
  .chart .seg-5 { fill: var(--warn); }
  .chart .seg-6 { fill: var(--critical); }
  .chart .seg-7 { fill: var(--text-dim); }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); margin-right: 6px; animation: pulse 2s ease-in-out infinite; }
  .live-dot.stale { background: var(--warn); animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
  .seg { display: flex; gap: 4px; }
  .seg button { padding: 5px 10px; font-size: 12px; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
  .sub-title { margin: 14px 0 6px; font-size: 12px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .bar-row .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: -1px; }
  .more { margin-top: 10px; }
  .more summary { cursor: pointer; font-size: 13px; color: var(--text-dim); padding: 6px 0; }
  .more summary:hover { color: var(--accent); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-dim); margin-bottom: 8px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  .table-wrap { overflow-x: auto; }
  table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-dim);
    font-weight: 500;
    padding: 0 12px 8px 0;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  table.data td { padding: 8px 12px 8px 0; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.data tr:last-child td { border-bottom: none; }
  table.data td.num, table.data th.num { text-align: right; padding-left: 12px; padding-right: 12px; }

  .empty-note { color: var(--text-dim); font-size: 13px; padding: 6px 0; }

  footer.foot { margin-top: 24px; font-size: 11px; color: var(--text-dim); text-align: center; }

  @media (max-width: 520px) {
    h1 { font-size: 22px; }
    .kpi .value { font-size: 24px; }
    .top-right { width: 100%; }
    .top-right button { flex: 1; }
    .bar-row { grid-template-columns: minmax(60px, 90px) 1fr auto; gap: 8px; }
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="eyebrow">Alert Proxy · панель власника</div>
    <h1>Вартовий</h1>
    <div class="subtitle"><span class="live-dot stale" id="liveDot"></span><span id="lastUpdated">підключення…</span></div>
  </div>
  <div class="top-right">
    <span class="pill" id="healthPill"><span class="dot"></span><span>Немає даних</span></span>
  </div>
</header>

<div id="settingsPanel" hidden>
  <div class="field-row">
    <div class="field">
      <label for="baseUrlInput">Адреса сервера</label>
      <input id="baseUrlInput" type="url" inputmode="url" autocomplete="off">
    </div>
    <div class="field">
      <label for="adminKeyInput">Адмін-ключ (ADMIN_KEY)</label>
      <input id="adminKeyInput" type="password" placeholder="••••••••" autocomplete="off">
    </div>
  </div>
  <p class="settings-note">Ключ зберігається лише в цьому браузері й надсилається тільки на цей сервер.</p>
  <div class="field-actions">
    <button class="primary" id="saveBtn">Зберегти й підключитись</button>
    <button id="clearBtn">Забути ключ</button>
  </div>
</div>

<nav class="tabs" role="tablist" aria-label="Розділи">
  <button role="tab" data-tab="overview" aria-selected="true">Огляд<span class="badge" id="healthBadge" hidden></span></button>
  <button role="tab" data-tab="sources" aria-selected="false">Джерела</button>
  <button role="tab" data-tab="users" aria-selected="false">Користувачі</button>
  <button role="tab" data-tab="web" aria-selected="false">Вебмапа</button>
  <button role="tab" data-tab="system" aria-selected="false">Система</button>
</nav>

<main>
  <section id="tab-overview" data-panel="overview">
    <div id="healthList"></div>
    <div class="kpi-grid" id="overviewKpis"></div>
    <div class="columns">
      <div class="card">
        <h2>Стан джерел</h2>
        <div id="sourceSummary"></div>
      </div>
      <div class="card">
        <h2>Підключення в реальному часі</h2>
        <div id="connectionSummary"></div>
      </div>
    </div>
  </section>

  <section id="tab-sources" data-panel="sources" hidden>
    <div class="columns">
      <div class="card" id="cardAlertsInUa"></div>
      <div class="card" id="cardNeptun"></div>
    </div>
    <div class="columns">
      <div class="card" id="cardUkraineAlarm"></div>
      <div class="card" id="cardStats"></div>
    </div>
    <div class="columns">
      <div class="card" id="cardHistory"></div>
      <div class="card" id="cardDeepState"></div>
    </div>
    <div class="card" id="cardStale"></div>
  </section>

  <section id="tab-users" data-panel="users" hidden>
    <div id="usersBody"><div class="empty-note">Завантаження статистики користувачів…</div></div>
  </section>

  <section id="tab-web" data-panel="web" hidden>
    <div id="webBody"><div class="empty-note">Завантаження статистики вебмапи…</div></div>
  </section>

  <section id="tab-system" data-panel="system" hidden>
    <div class="columns">
      <div class="card" id="cardResources"></div>
      <div class="card" id="cardArchive"></div>
    </div>
    <div class="columns">
      <div class="card" id="cardBackup"></div>
      <div class="card" id="cardServer"></div>
    </div>
  </section>
</main>

<footer class="foot" id="footer">Вартовий · дані оновлюються автоматично</footer>

<button id="gearBtn" type="button" aria-label="Налаштування підключення" aria-expanded="false" title="Налаштування підключення">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06A2 2 0 1 1 7.08 4.14l.06.06a1.7 1.7 0 0 0 1.87.34h0A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0A1.7 1.7 0 0 0 20.91 10H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1z"/></svg>
</button>
<script>
(function () {
  'use strict';

  const POLL_MS = 10000;
  const USERS_POLL_MS = 30000;
  const STORE_KEY = 'vartovyi.adminKey';
  const STORE_URL = 'vartovyi.baseUrl';
  const STORE_TAB = 'vartovyi.tab';

  let scrollBeforeRotation = 0;
  function settleViewport() {
    const max = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
    window.scrollTo(0, Math.min(scrollBeforeRotation, max));
    window.dispatchEvent(new Event('resize'));
  }
  window.addEventListener('scroll', () => { scrollBeforeRotation = window.scrollY; }, { passive: true });
  window.addEventListener('orientationchange', () => {
    [100, 400, 900].forEach((delay) => setTimeout(settleViewport, delay));
  });
  window.addEventListener('pageshow', settleViewport);

  const state = { versionsOpen: false, userList: null, userListOpen: false, userListBusy: false, web: null, webTimer: null, webBusy: false, webPeriod: 'last7d', countryPeriod: 'last7d', status: null, ua: null, users: null, tab: 'overview', timer: null, usersTimer: null, busy: false, usersBusy: false };

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, (c) => {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function read(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
  function write(key, value) { try { localStorage.setItem(key, value); } catch (e) {} }
  function remove(key) { try { localStorage.removeItem(key); } catch (e) {} }

  function fmtNum(n) { return n === null || n === undefined ? '-' : Number(n).toLocaleString('uk-UA'); }
  function fmtBytes(b) {
    if (b === null || b === undefined) return '-';
    const units = ['Б', 'КБ', 'МБ', 'ГБ', 'ТБ'];
    let i = 0;
    let v = b;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return `${i === 0 ? v : v.toFixed(v >= 100 ? 0 : 1)} ${units[i]}`;
  }
  function fmtDuration(ms) {
    if (ms === null || ms === undefined) return '-';
    const s = Math.floor(ms / 1000);
    if (s < 60) return `${s} с`;
    const m = Math.floor(s / 60);
    if (m < 60) return `${m} хв`;
    const h = Math.floor(m / 60);
    if (h < 48) return `${h} год ${m % 60} хв`;
    return `${Math.floor(h / 24)} д ${h % 24} год`;
  }
  function fmtAgo(ms) { return ms === null || ms === undefined ? '-' : `${fmtDuration(ms)} тому`; }
  function fmtDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    if (isNaN(d)) return '-';
    const opts = { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' };
    if (d.getFullYear() !== new Date().getFullYear()) opts.year = 'numeric';
    return d.toLocaleString('uk-UA', opts);
  }
  function level(pct) { return pct >= 90 ? 'critical' : pct >= 70 ? 'warn' : ''; }

  function line(k, v) { return `<div class="line"><span class="k">${esc(k)}</span><span class="v">${v}</span></div>`; }
  function chip(cls, text) { return `<span class="status-chip ${cls}">${esc(text)}</span>`; }
  function gauge(pct) {
    const p = Math.max(0, Math.min(100, pct || 0));
    return `<div class="progress-track"><div class="progress-fill ${level(p)}" style="width:${p}%"></div></div>`;
  }
  function kpi(label, value, sub, extra) {
    return `<div class="card kpi"><div class="label">${esc(label)}</div><div class="value">${value}</div>${
      sub ? `<div class="sub">${sub}</div>` : ''}${extra || ''}</div>`;
  }
  function barRows(items, nameKey, valueKey, max, wide) {
    if (!items.length) return '<div class="empty-note">Даних ще немає</div>';
    const top = max || Math.max.apply(null, items.map((i) => { return i[valueKey]; })) || 1;
    return items.map((item) => {
      return `<div class="bar-row${wide ? ' wide' : ''}"><span class="name" title="${esc(item[nameKey])}">${esc(item[nameKey]) 
        }</span><span class="track"><span class="fill" style="width:${Math.round((item[valueKey] / top) * 100)}%;display:block"></span></span><span class="num">${
        fmtNum(item[valueKey])}</span></div>`;
    }).join('');
  }

  function niceMax(v) {
    const raw = Math.max(1, v) / 4;
    const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const n = raw / p;
    const step = Math.max(1, (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p);
    return step * 4;
  }

  function stackedChart(days, versions, width, labelOf) {
    const W = width || 600, H = 200, padL = 36, padR = 8, padT = 10, padB = 24;
    const n = days.length;
    if (!n) return '<div class="empty-note">Даних ще немає</div>';
    const totals = days.map((d) => { return versions.reduce((sum, v) => { return sum + (d.versions[v] || 0); }, 0); });
    const max = niceMax(Math.max(1, Math.max.apply(null, totals)));
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const groupW = plotW / n;
    const barW = Math.max(3, groupW * 0.72);
    let out = '';
    for (let i = 0; i <= 4; i++) {
      const y = padT + plotH - (plotH * i) / 4;
      out += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>` +
        `<text class="axis" x="${padL - 6}" y="${y + 3}" text-anchor="end">${fmtNum(Math.round((max * i) / 4))}</text>`;
    }
    days.forEach((d, idx) => {
      const x = padL + idx * groupW + (groupW - barW) / 2;
      let acc = 0;
      versions.forEach((v, vi) => {
        const count = d.versions[v] || 0;
        if (!count) return;
        const h = (plotH * count) / max;
        acc += h;
        out += `<rect class="seg-${Math.min(vi, 7)}" x="${x.toFixed(1)}" y="${(padT + plotH - acc).toFixed(1)}" width="${barW.toFixed(1) 
          }" height="${h.toFixed(1)}"><title>${esc(`${d.day} · ${labelOf ? labelOf(v) : v}: ${count}`)}</title></rect>`;
      });
    });
    const step = Math.ceil(n / Math.max(2, Math.floor(plotW / 46)));
    days.forEach((d, idx) => {
      if (idx % step === 0) out += `<text class="axis" x="${(padL + idx * groupW + groupW / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(d.day.slice(5).replace('-', '.'))}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Історія версій застосунку">${out}</svg>`;
  }

  const VERSION_COLORS = ['accent', 'accent-2', 'ok', 'c5', 'c6', 'warn', 'critical', 'text-dim'];

  function barChart(series, labels, opts) {
    const W = (opts && opts.width) || 600, H = (opts && opts.height) || 190, padL = 36, padR = 8, padT = 10, padB = 24;
    const n = labels.length;
    if (!n) return '<div class="empty-note">Даних ще немає</div>';
    let all = [];
    series.forEach((s) => { all = all.concat(s.values); });
    const max = niceMax(Math.max(1, Math.max.apply(null, all)));
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const groupW = plotW / n;
    const barW = Math.max(2, (groupW * 0.74) / series.length);
    let out = '';
    for (let i = 0; i <= 4; i++) {
      const y = padT + plotH - (plotH * i) / 4;
      out += `<line class="grid" x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}"/>` +
        `<text class="axis" x="${padL - 6}" y="${y + 3}" text-anchor="end">${fmtNum(Math.round((max * i) / 4))}</text>`;
    }
    series.forEach((s, si) => {
      s.values.forEach((v, idx) => {
        const h = (plotH * v) / max;
        const x = padL + idx * groupW + (groupW - barW * series.length) / 2 + si * barW;
        out += `<rect class="${s.cls}" x="${x.toFixed(1)}" y="${(padT + plotH - h).toFixed(1)}" width="${barW.toFixed(1) 
          }" height="${Math.max(h, v > 0 ? 1 : 0).toFixed(1)}" rx="1.5"><title>${esc(labels[idx])}: ${v}</title></rect>`;
      });
    });
    const step = Math.ceil(n / Math.max(2, Math.floor(plotW / 46)));
    labels.forEach((l, idx) => {
      if (idx % step === 0) {
        out += `<text class="axis" x="${(padL + idx * groupW + groupW / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle">${esc(l)}</text>`;
      }
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc((opts && opts.label) || 'Діаграма')}">${out}</svg>`;
  }

  function healthLevel(issues) {
    if (issues.some((i) => { return i.level === 'crit'; })) return 'critical';

    return 'ok';
  }

  function renderHealth() {
    const s = state.status;
    const issues = s ? s.health || [] : [];
    const lvl = s ? healthLevel(issues) : '';
    const pill = $('healthPill');
    pill.className = `pill ${lvl}`;
    pill.innerHTML = `<span class="dot"></span><span>${!s ? 'Немає даних' : lvl === 'critical' ? 'Потрібна увага' : lvl === 'warn' ? 'Є зауваження' : 'Усе гаразд'}</span>`;

    const problems = issues.filter((i) => { return i.level !== 'info'; });
    const badge = $('healthBadge');
    badge.hidden = !problems.length;
    badge.className = `badge${lvl === 'warn' ? ' warn' : ''}`;
    badge.textContent = problems.length;

    let html = '';
    if (s && !issues.length) html = '<div class="notice ok">Усі перевірки пройдено.</div>';
    issues.forEach((i) => {
      const text = HEALTH_TEXT[i.code] ? HEALTH_TEXT[i.code](i) : i.message;
      html += `<div class="notice ${i.level === 'crit' ? 'critical' : i.level}">${esc(text)}</div>`;
    });

  const USER_LIST_SHOWN = 500;

  const VERSION_SHOWN = 5;

  function compareVersions(a, b) {
    const pa = a.split('.').map(Number);
    const pb = b.split('.').map(Number);
    for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
      const diff = (pb[i] || 0) - (pa[i] || 0);
      if (diff) return diff;
    }
    return 0;
  }

  function versionModel(u) {
    const seen = new Set([...u.versionHistory.versions, ...(u.versionTotals || []).map((v) => v.version)]);
    const known = Array.from(seen).filter((v) => v !== 'unknown').sort(compareVersions);
    const shown = known.slice(0, VERSION_SHOWN);
    const groups = [...shown];
    if (known.length > shown.length) groups.push('older');
    if (seen.has('unknown')) groups.push('unknown');

    const groupOf = (version) => (shown.includes(version) ? version : version === 'unknown' ? 'unknown' : 'older');
    const labelOf = (group) => (group === 'older' ? 'старіші' : group === 'unknown' ? 'невідомо' : group);

    const days = u.versionHistory.days.slice(-VERSION_CHART_DAYS).map((d) => {
      const versions = {};
      Object.entries(d.versions).forEach(([version, count]) => {
        const group = groupOf(version);
        versions[group] = (versions[group] || 0) + count;
      });
      return { day: d.day, versions };
    });

    const totals = {};
    (u.versionTotals || []).forEach(({ version, users }) => {
      const group = groupOf(version);
      totals[group] = (totals[group] || 0) + users;
    });

    return { groups, labelOf, days, totals, latest: shown[0] };
  }

  function versionDistribution(model) {
    const sum = Object.values(model.totals).reduce((total, count) => total + count, 0);
    if (!sum) return '<div class="empty-note">Даних ще немає</div>';

    return model.groups
      .filter((group) => model.totals[group])
      .map((group) => {
        const color = VERSION_COLORS[model.groups.indexOf(group)];
        const share = Math.round((model.totals[group] / sum) * 100);
        const latest = group === model.latest ? ` ${chip('ok', 'остання')}` : '';
        return `<div class="bar-row wide"><span class="name mono"><i class="swatch" style="background:var(--${color})"></i>${esc(model.labelOf(group))}${latest}</span><span class="track"><span class="fill" style="width:${share}%;display:block;background:var(--${color})"></span></span><span class="num">${fmtNum(model.totals[group])} · ${share}%</span></div>`;
      })
      .join('');
  }

  function versionTable(model) {
    if (!model.days.length) return '<div class="empty-note">Даних ще немає</div>';

    const head = model.groups.map((group) => `<th class="num">${esc(model.labelOf(group))}</th>`).join('');
    const rows = model.days
      .slice()
      .reverse()
      .map((d) => {
        const cells = model.groups.map((group) => `<td class="num mono">${d.versions[group] ? fmtNum(d.versions[group]) : '-'}</td>`).join('');
        return `<tr><td class="mono">${esc(d.day.slice(5).replace('-', '.'))}</td>${cells}</tr>`;
      })
      .join('');

    return `<div class="table-wrap"><table class="data"><thead><tr><th>День</th>${head}</tr></thead><tbody>${rows}</tbody></table></div><p class="settings-note" style="margin-top:10px">Унікальні пристрої за добу, окремо по версіях.</p>`;
  }

  function exportUsers(kind) {
    const rows = state.userList ? state.userList.users : [];
    const stamp = new Date().toISOString().slice(0, 10);
    let text;
    let type;

    if (kind === 'json') {
      text = JSON.stringify(rows, null, 2);
      type = 'application/json';
    } else {
      const keys = ['id', 'country', 'version', 'activeDays', 'requests', 'firstSeen', 'lastSeen'];
      const cell = (value) => `"${String(value ?? '').replace(/"/g, '""')}"`;
      text = [keys.join(','), ...rows.map((row) => keys.map((key) => cell(row[key])).join(','))].join('\n');
      type = 'text/csv';
    }

    const link = document.createElement('a');
    link.href = URL.createObjectURL(new Blob([text], { type: `${type};charset=utf-8` }));
    link.download = `alert-proxy-users-${stamp}.${kind}`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);

  $('gearBtn').addEventListener('click', () => {
    toggleSettings();
    const open = !$('settingsPanel').hidden;
    $('gearBtn').setAttribute('aria-expanded', String(open));
    if (open) window.scrollTo({ top: 0, behavior: 'smooth' });
  });
  $('saveBtn').addEventListener('click', () => {
    write(STORE_URL, $('baseUrlInput').value.trim());
    write(STORE_KEY, $('adminKeyInput').value.trim());
    $('settingsPanel').hidden = true;
    refresh().then(() => { if (state.tab === 'users') refreshUsers(); });
  });
  $('clearBtn').addEventListener('click', () => {
    remove(STORE_KEY);
    remove(STORE_URL);
    $('adminKeyInput').value = '';
    state.status = null;
    state.users = null;
    setConnectionError('Ключ видалено', 'warn');
  });

  $('baseUrlInput').value = settings().baseUrl;
  const savedTab = read(STORE_TAB);
  selectTab(['overview', 'sources', 'users', 'web', 'system'].indexOf(savedTab) >= 0 ? savedTab : 'overview');
  refresh();
  startTimers();
})();
</script>
</body>
</html>
