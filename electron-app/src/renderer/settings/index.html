<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <title>Alert Server - Налаштування</title>
    <link rel="stylesheet" href="index.css" />
</head>
<body>
    <div id="layout">
        <section id="regions-column">
            <div id="map-container"></div>
            <header>
                <h1 id="regionsHeader"></h1>
                <input id="search" type="text" autocomplete="off" />
            </header>
            <main id="tree"></main>
            <footer>
                <span id="summary"></span>
                <button id="clearRegionsButton" class="clear-button"></button>
            </footer>
        </section>
        <section id="general-settings">
            <fieldset class="settings-group">
                <legend id="settingsGroupGeneral"></legend>
                <label><input type="checkbox" id="runAtStartup" /> <span id="runAtStartupLabel"></span></label>
                <label>
                    <span id="languageLabel"></span>
                    <select id="language">
                        <option value="Ukrainian">Українська</option>
                        <option value="English">English</option>
                    </select>
                </label>
                <label>
                    <span id="themeLabel"></span>
                    <select id="theme">
                        <option value="light" id="themeLightOption"></option>
                        <option value="dark" id="themeDarkOption"></option>
                        <option value="system" id="themeSystemOption"></option>
                    </select>
                </label>
                <label>
                    <span id="updateCheckIntervalLabel"></span>
                    <input type="number" id="updateCheckIntervalHours" min="1" max="168" style="width: 3em" />
                </label>
            </fieldset>
            <fieldset class="settings-group">
                <legend id="settingsGroupNotifications"></legend>
                <label><input type="checkbox" id="visualNotificationsEnabled" /> <span id="visualNotificationsLabel"></span></label>
                <label><input type="checkbox" id="activeAlertNotifyEnabled" /> <span id="activeAlertNotifyLabel"></span></label>
                <label style="margin-left: 18px"><input type="checkbox" id="showLiveMapOnAlert" /> <span id="showLiveMapOnAlertLabel"></span></label>
                <label><input type="checkbox" id="forecastNotifyEnabled" /> <span id="settingsForecastNotifyLabel"></span></label>
                <label>
                    <span id="forecastNotifyLookaheadLabel"></span>
                    <input type="number" id="forecastNotifyLookaheadMinutes" min="1" max="600" style="width: 4em" />
                </label>
                <label>
                    <span id="alertSoundLabel"></span>
                    <select id="alertSoundMode">
                        <option value="none" id="alertSoundModeNoneOption"></option>
                        <option value="siren" id="alertSoundModeSirenOption"></option>
                        <option value="voice" id="alertSoundModeVoiceOption"></option>
                    </select>
                </label>
                <label>
                    <span id="alertSoundCountLabel"></span>
                    <input type="number" id="alertSoundCount" min="1" max="10" style="width: 3em" />
                </label>
                <label>
                    <span id="massAttackThresholdLabel"></span>
                    <input type="number" id="massAttackThreshold" min="50" max="100" style="width: 3em" />
                </label>
            </fieldset>
            <fieldset class="settings-group">
                <legend id="settingsGroupDataSource"></legend>
                <label>
                    <span id="alertSourceProviderLabel"></span>
                    <select id="alertSourceProvider">
                        <option value="alerts.in.ua" id="alertSourceProviderAlertsInUaOption"></option>
                        <option value="neptun" id="alertSourceProviderNeptunOption"></option>
                    </select>
                </label>
                <p id="alertSourceProviderNote" class="settings-note"></p>
            </fieldset>
        </section>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
